name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.25.0"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      template-release: ${{ steps.template.outputs.release }}
      template-version: ${{ steps.template.outputs.version }}
      template-asset: ${{ steps.template.outputs.asset }}
    steps:
      - name: Check out the tagged source without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive the coordinated template release from CLI source
        id: template
        run: python3 scripts/template-release-metadata.py --github-output "$GITHUB_OUTPUT"

      - name: Require exact tag, source version, and mainline agreement
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          SOURCE_VERSION=$(sed -n 's/^const Current = "\([^"]*\)"$/\1/p' internal/version/version.go)
          test -n "$SOURCE_VERSION"
          test "$SOURCE_VERSION" = "$RELEASE_TAG"
          TAG_COMMIT=$(git rev-parse HEAD)
          test "$TAG_COMMIT" = "$GITHUB_SHA"
          git fetch --force --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main; then
            echo "release tag must point to a commit on origin/main" >&2
            exit 1
          fi

  full-verification:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  template:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.fetch.outputs.sha256 }}
    steps:
      - name: Download and fingerprint the coordinated template once
        id: fetch
        env:
          TEMPLATE_RELEASE: ${{ needs.preflight.outputs.template-release }}
          TEMPLATE_VERSION: ${{ needs.preflight.outputs.template-version }}
          TEMPLATE_ASSET: ${{ needs.preflight.outputs.template-asset }}
        run: |
          mkdir -p coordinated-template
          TEMPLATE_ARCHIVE="coordinated-template/${TEMPLATE_ASSET}"
          TEMPLATE_CHECKSUMS="coordinated-template/template-checksums.txt"
          TEMPLATE_RELEASE_URL="https://github.com/virtualboard/template-base/releases/download/${TEMPLATE_RELEASE}"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 120 --max-filesize 52428800 \
            --retry 3 --output "$TEMPLATE_ARCHIVE" \
            "${TEMPLATE_RELEASE_URL}/${TEMPLATE_ASSET}"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 30 --max-filesize 4096 \
            --retry 3 --output "$TEMPLATE_CHECKSUMS" \
            "${TEMPLATE_RELEASE_URL}/template-checksums.txt"
          test "$(wc -l < "$TEMPLATE_CHECKSUMS" | tr -d ' ')" = 1
          TEMPLATE_SHA256=$(awk -v asset="$TEMPLATE_ASSET" '$2 == asset || $2 == "*" asset { print $1 }' "$TEMPLATE_CHECKSUMS")
          [[ "$TEMPLATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$TEMPLATE_ARCHIVE" | awk '{print $1}')" = "$TEMPLATE_SHA256"
          test "$(stat --format='%s' "$TEMPLATE_ARCHIVE")" -le 52428800
          VERSION_ENTRY=$(unzip -Z1 "$TEMPLATE_ARCHIVE" | awk -F/ '$2 == "version.txt" && NF == 2 { print }')
          test "$(printf '%s\n' "$VERSION_ENTRY" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          test "$(unzip -p "$TEMPLATE_ARCHIVE" "$VERSION_ENTRY" | tr -d '[:space:]')" = "$TEMPLATE_VERSION"
          printf 'release=%s\nasset=%s\nsha256=%s\n' \
            "$TEMPLATE_RELEASE" "$TEMPLATE_ASSET" "$TEMPLATE_SHA256" \
            > coordinated-template/metadata.env
          echo "sha256=$TEMPLATE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Stage the single immutable template input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coordinated-template-${{ github.sha }}-${{ github.run_attempt }}
          path: coordinated-template/
          if-no-files-found: error
          retention-days: 1

  release-smoke:
    needs: [preflight, full-verification, template]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tagged source without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up exact Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Retrieve the exact coordinated template input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coordinated-template-${{ github.sha }}-${{ github.run_attempt }}
          path: coordinated-template

      - name: Build and exercise the release candidate end to end
        env:
          TEMPLATE_RELEASE: ${{ needs.preflight.outputs.template-release }}
          TEMPLATE_ASSET: ${{ needs.preflight.outputs.template-asset }}
          TEMPLATE_SHA256: ${{ needs.template.outputs.sha256 }}
        run: |
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          test "$(sha256sum "coordinated-template/${TEMPLATE_ASSET}" | awk '{print $1}')" = "$TEMPLATE_SHA256"
          mkdir -p smoke
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X github.com/virtualboard/vb-cli/cmd.templateArchiveSHA256=${TEMPLATE_SHA256}" \
            -o smoke/vb .
          scripts/release-smoke.sh \
            smoke/vb "coordinated-template/${TEMPLATE_ASSET}" "$TEMPLATE_RELEASE"

  build:
    needs: [preflight, full-verification, template, release-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: vb-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: vb-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact: vb-macos-amd64
          - goos: darwin
            goarch: arm64
            artifact: vb-macos-arm64
          - goos: windows
            goarch: amd64
            artifact: vb-windows-amd64.exe
          - goos: windows
            goarch: arm64
            artifact: vb-windows-arm64.exe
    steps:
      - name: Check out the tagged source without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up exact Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Retrieve the shared immutable template input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coordinated-template-${{ github.sha }}-${{ github.run_attempt }}
          path: coordinated-template

      - name: Verify the shared template digest
        env:
          TEMPLATE_ASSET: ${{ needs.preflight.outputs.template-asset }}
          TEMPLATE_SHA256: ${{ needs.template.outputs.sha256 }}
        run: |
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          test "$(sha256sum "coordinated-template/${TEMPLATE_ASSET}" | awk '{print $1}')" = "$TEMPLATE_SHA256"
          grep -Fx "sha256=$TEMPLATE_SHA256" coordinated-template/metadata.env

      - name: Build one release asset
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TEMPLATE_SHA256: ${{ needs.template.outputs.sha256 }}
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X github.com/virtualboard/vb-cli/cmd.templateArchiveSHA256=${TEMPLATE_SHA256}" \
            -o "dist/${{ matrix.artifact }}" .
          test -s "dist/${{ matrix.artifact }}"

      - name: Upload the release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}-${{ github.run_attempt }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retrieve all platform binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vb-*-${{ github.run_attempt }}
          path: release-assets
          merge-multiple: true

      - name: Verify the complete asset set and create checksums
        run: |
          cd release-assets
          for asset in \
            vb-linux-amd64 \
            vb-linux-arm64 \
            vb-macos-amd64 \
            vb-macos-arm64 \
            vb-windows-amd64.exe \
            vb-windows-arm64.exe; do
            test -s "$asset"
          done
          test "$(find . -maxdepth 1 -type f -name 'vb-*' | wc -l | tr -d ' ')" = 6
          sha256sum ./vb-* > checksums.txt
          test "$(wc -l < checksums.txt | tr -d ' ')" = 6

      - name: Stage the immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-release-${{ github.sha }}-${{ github.run_attempt }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  attest:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Retrieve the immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-release-${{ github.sha }}-${{ github.run_attempt }}
          path: release-assets

      - name: Attest release-bundle provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release-assets/*

  publisher-tool:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed release publisher without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test and stage the source-bound draft publisher
        run: |
          python3 scripts/test_publish_github_release.py -v
          install -m 0555 scripts/publish_github_release.py \
            "$RUNNER_TEMP/publish_github_release.py"

      - name: Upload the immutable publisher tool
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publisher-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish_github_release.py
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [attest, publisher-tool]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Retrieve the attested release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-release-${{ github.sha }}-${{ github.run_attempt }}
          path: release-assets

      - name: Retrieve the tested release publisher
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-publisher-${{ github.sha }}-${{ github.run_attempt }}
          path: release-publisher

      - name: Require the complete release bundle
        run: |
          for asset in \
            vb-linux-amd64 \
            vb-linux-arm64 \
            vb-macos-amd64 \
            vb-macos-arm64 \
            vb-windows-amd64.exe \
            vb-windows-arm64.exe \
            checksums.txt; do
            test -s "release-assets/$asset"
          done
          test -s release-publisher/publish_github_release.py

      - name: Verify a source-bound draft before atomic publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 release-publisher/publish_github_release.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --source-sha "$GITHUB_SHA" \
            --title "VirtualBoard CLI ${RELEASE_TAG}" \
            --asset release-assets/vb-linux-amd64 \
            --asset release-assets/vb-linux-arm64 \
            --asset release-assets/vb-macos-amd64 \
            --asset release-assets/vb-macos-arm64 \
            --asset release-assets/vb-windows-amd64.exe \
            --asset release-assets/vb-windows-arm64.exe \
            --asset release-assets/checksums.txt
