name: Continuous integration

on:
  workflow_call:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.0"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: |
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          go mod download
          go mod verify

      - name: Verify formatting and generated workflow pins
        run: |
          test -z "$(gofmt -l .)"
          python3 scripts/template-release-metadata.py
          python3 scripts/check-workflows.py
          python3 scripts/test_publish_github_release.py -v

      - name: Run tests and static analysis
        run: |
          go vet ./...
          go test -race ./...
          make test
          make scan

      - name: Build the CLI
        run: go build -trimpath -buildvcs=false ./...

  platform-core:
    name: Core, lifecycle, and install · ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Verify exact toolchain and dependencies
        shell: bash
        run: |
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          go mod download
          go mod verify

      - name: Run core, lifecycle, and integration-install tests
        shell: bash
        run: go test ./...

      - name: Build the native CLI
        shell: bash
        run: go build -trimpath -buildvcs=false ./...
